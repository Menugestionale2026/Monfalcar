    .hero-shade {
      background: linear-gradient(90deg, rgb(11 42 91 / 0.92) 0%, rgb(11 42 91 / 0.76) 46%, rgb(11 42 91 / 0.3) 100%);
    }
  }
  .btn-outline-light {
    border: 2px solid #fff;
    color: #fff;
    background: transparent;
  }
  .btn-outline-light:hover:not(:disabled) {
    background: rgb(255 255 255 / 0.12);
  }
  .btn-danger {
    border: 2px solid #b42318;
    color: #b42318;
    background: #fff;
  }
  .btn-danger:hover:not(:disabled) {
    background: #fdecea;
  }
  .btn-sm {
    min-height: 2.25rem;
    padding: 0.375rem 0.875rem;
    font-size: 0.875rem;
  }
  .input {
    width: 100%;
    min-height: 2.875rem;
    border-radius: 10px;
    border: 1.5px solid var(--color-brand-field);
    background: #fff;
    padding: 0.625rem 0.875rem;
    font-size: 1rem;
    color: var(--color-brand-navy);
  }
  textarea.input {
    min-height: 6rem;
    resize: vertical;
  }
  .label {
    display: block;
    margin-bottom: 0.375rem;
    font-size: 0.875rem;
    font-weight: 600;
  }
  .hint {
    margin-top: 0.25rem;
    font-size: 0.8125rem;
    color: var(--color-brand-muted);
  }
  .card {
    border-radius: 1rem;
    border: 1px solid var(--color-brand-line);
    background: #fff;
  }
  .eyebrow {
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-brand-blue);
  }
  .h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.875rem;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  @media (min-width: 48rem) {
    .h2 {
      font-size: 2.5rem;
    }
  }
  .chip {
    display: inline-flex;
    min-height: 2.5rem;
    align-items: center;
    border-radius: 999px;
    border: 1.5px solid var(--color-brand-line);
    padding: 0.375rem 1.125rem;
    font-size: 0.9375rem;
    font-weight: 500;
    background: #fff;
  }
  .chip[aria-pressed='true'] {
    background: var(--color-brand-blue);
    border-color: var(--color-brand-blue);
    color: #fff;
    font-weight: 600;
  }
}
